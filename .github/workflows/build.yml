name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compile
        run: python -m compileall -q novaclick main.py
      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name AutoClicker
          --icon "$PWD/build/autoclicker.ico" --version-file "$PWD/build/version_info.txt"
          --distpath build/dist --workpath build/work --specpath build main.py
      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\AutoClicker.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows
          path: build/dist/AutoClicker/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Installer
          path: build/installer/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compile
        run: python -m compileall -q novaclick main.py
      - name: Build Linux bundle
        run: bash build/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Linux
          path: build/AutoClicker-*-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoClicker-Installer
          path: assets/installer
      - uses: actions/download-artifact@v4
        with:
          name: AutoClicker-Linux
          path: assets/linux
      - uses: softprops/action-gh-release@v2
        with:
          name: AutoClicker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            assets/installer/AutoClicker-Setup-*.exe
            assets/linux/AutoClicker-*-linux-x86_64.tar.gz
